---
name: Scheduled Python Script MarketIntel GAlerts

on:
  # push:
  #  branches: [ master ] 
  schedule:
    # Runs at 8:00 AM Malaysia Time (00:00 UTC) every day
    - cron: '0 0 * * *'
  workflow_dispatch: # Enables manual run from GitHub UI

permissions:
  contents: write  # Needed to push changes back to the repository

jobs:
  run-python-script:
    name: Run Python Script
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Full history is required for rebase/pull

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests pytz urllib3 beautifulsoup4

      - name: Run Python script and push updates
        run: |
          cd marketIntel
          python rssGA.py
          git config --global user.email "booluckgmie@gmail.com"
          git config --global user.name "booluckgmie"
          git stash
          git pull --rebase
          git stash pop || true
          git add marketGAlerts2025.csv -f
          git commit -m "Update data" || echo "No changes to commit"
          pushed=0
          for i in 1 2 3 4 5; do
            if git push origin HEAD:master; then pushed=1; break; fi
            echo "Push rejected (attempt $i of 5): rebasing onto the latest master and retrying"
            git pull --rebase --autostash origin master || exit 1
            sleep $((RANDOM % 5 + 2))
          done
          [ "$pushed" = 1 ] || { echo "Push failed after 5 attempts"; exit 1; }