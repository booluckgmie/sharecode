name: Bursa PN17/GN3 Monitor

on:
  schedule:
    # 02:00 UTC = 10:00 AM MYT (UTC+8), runs daily
    - cron: "0 2 * * *"
    # Backup runs: Cloudflare blocks some runner IPs intermittently; a later run
    # gets a different runner. The script is idempotent (no change => no commit/email).
    - cron: "0 6 * * *"
  workflow_dispatch:   # allow manual trigger from GitHub Actions tab

# Suppress Node.js 20 deprecation warnings
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write      # required to push CSV commits back to repo

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout repo ────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          # Clean any local modifications before starting
          clean: true

      # ── 2. Set up Python 3.11 ───────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ── 3. Install Python dependencies ──────────────────────────────────────
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r bursaMY/requirements.txt

      # ── 4. Install Playwright Chromium browser ───────────────────────────────
      #    Only used as fallback if cloudscraper cannot bypass Cloudflare.
      - name: Install Playwright browser
        run: |
          playwright install chromium --with-deps
          sudo apt-get install -y xvfb

      # ── 5. Run the monitor script ───────────────────────────────────────────
      - name: Run Bursa PN17/GN3 monitor
        env:
          GMAIL_USER:     ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
          NOTIFY_EMAILS:  ${{ secrets.NOTIFY_EMAILS }}
        run: |
          # Headed Chromium under a virtual display + up to 3 attempts (5 min apart)
          for i in 1 2 3; do
            echo "=== attempt $i/3 ==="
            if xvfb-run -a --server-args="-screen 0 1366x768x24" python bursaMY/bursa_notifier.py; then
              exit 0
            fi
            [ "$i" -lt 3 ] && sleep 300
          done
          exit 1

      # ── 5b. Rebuild the dashboard data from the CSVs ─────────────────────────
      - name: Build dashboard data
        run: python bursaMY/build_dashboard_data.py

      # ── 6. Commit and push any changes ──────────────────────────────────────
      - name: Commit & push updates
        run: |
          git config user.name "booluckgmie"
          git config user.email "booluckgmie@gmail.com"
          
          # Check current branch
          CURRENT_BRANCH=$(git rev-parse --abbrev-ref HEAD)
          echo "Current branch: ${CURRENT_BRANCH}"
          
          # Stash any unexpected changes
          git stash --include-untracked || true
          
          # Pull latest changes (in case of race condition)
          git pull --rebase origin ${CURRENT_BRANCH} || true
          
          # Pop stash if any
          git stash pop || true
          
          # Stage files (force add to override any gitignore issues)
          git add -f bursaMY/pn17_gn3_companies.csv \
                  bursaMY/pn17_gn3_historical.csv \
                  bursaMY/summary-reportPN17.csv \
                  bursaMY/last_run.json \
                  bursaMY/dashboard/data.json
          
          # Check if there are changes to commit
          if git diff --cached --quiet; then
            echo "No changes to commit. Done."
            exit 0
          fi
          
          # Commit
          git commit -m "chore: auto-update $(date +'%Y-%m-%d') Bursa PN17/GN3 data"
          
          # Push with force-with-lease (safe force push)
          git push --force-with-lease origin HEAD:${CURRENT_BRANCH}
