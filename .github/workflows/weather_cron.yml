---
name: Scheduled Python Script for Unofficial Weather Forecast https://open-meteo.com/

on:
  # push:
  #  branches: [ master ] 
  schedule:
    - cron: '40 * * * *' 
    
jobs:
  run-python-script:
    runs-on: ubuntu-latest
    name: Run Python Script

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"  # Set the desired Python version

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20  # Set the desired Node.js version
          
      - name: Install dependencies
        run: |
          pip install pandas requests pytz urllib3 tqdm
          pip install --upgrade pip

      - name: Run Python Script
        run: |
          python weather_cron.py
          cd data_weatherUO
          git config --global user.email "booluckgmie@gmail.com"
          git config --global user.name "booluckgmie"
          git pull
          git add .
          git commit -m "Update data"
          pushed=0
          for i in 1 2 3 4 5; do
            if git push origin HEAD:master; then pushed=1; break; fi
            echo "Push rejected (attempt $i of 5): rebasing onto the latest master and retrying"
            git pull --rebase --autostash origin master || exit 1
            sleep $((RANDOM % 5 + 2))
          done
          [ "$pushed" = 1 ] || { echo "Push failed after 5 attempts"; exit 1; }

